name: build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group lint
      - name: Ruff
        run: |
          uv run --no-sync ruff check anyts tests scripts
          uv run --no-sync ruff format anyts tests scripts --check
      - name: Mypy
        run: uv run --no-sync mypy

  test:
    name: test (${{ matrix.python-version }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Run tests
        run: uv run --no-sync pytest --cov anyts

  test-lowest:
    name: test (lowest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --resolution lowest-direct --no-default-groups --group test
      - name: Run tests
        run: uv run --no-sync pytest

  libraries:
    # The tests of the language libraries on the core of this branch. Tests marked core_sync
    # compare the pages and messages of a library with its released core, so the library
    # follows a change of the core in them when it moves onto that core; they are skipped here
    name: libraries (${{ matrix.library }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - library: ruTS
            # pymorphy3 installs the lemmatizer of a model, which ruTS does not use
            sync: --no-install-package pymorphy3 --no-install-package pymorphy3-dicts-ru --no-install-package dawg2-python
          - library: esTS
            sync: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: anyTS
      - name: Checkout the library
        uses: actions/checkout@v7
        with:
          repository: SergeyShk/${{ matrix.library }}
          path: library
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies with the core of this branch
        working-directory: library
        run: |
          uv sync --locked --no-default-groups --group test ${{ matrix.sync }}
          uv pip install ../anyTS
      - name: Take the pages of the core from this branch
        working-directory: library
        run: uv run --no-sync python scripts/core_docs.py ../anyTS
      - name: Run tests
        working-directory: library
        run: uv run --no-sync pytest -m "not network and not core_sync"

  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Run the examples of the docs
        run: uv run --no-sync pytest -m examples tests/test_docs_examples.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --only-group docs
      - name: Build docs
        run: uv run --no-sync mkdocs build --strict
