site_name: anyTS
site_url: https://sergeyshk.github.io/anyTS/
site_description: "The language-independent core of text statistics libraries"
repo_url: https://github.com/SergeyShk/anyTS

nav:
    - Home:
      - About: index.md
      - Installation: installation.md
      - Exceptions: exceptions.md
      - Authors: authors.md
    - Extraction:
      - Sentence extraction: extractors/sentences.md
      - Word extraction: extractors/words.md
      - Character N-gram extraction: extractors/char_ngrams.md
    - Statistics:
      - Lexical diversity metrics:
        - Metrics module: stats/diversity_stats.md
        - Metric functions: stats/diversity_stats_funcs.md
      - Cohesion helpers: stats/cohesion.md
      - Dependency tree helpers: stats/syntax.md
    - Corpus measures:
      - Keywords: corpus/keyness.md
      - Collocations: corpus/collocations.md
      - Word dispersion: corpus/dispersion.md
      - Stylometry: corpus/stylometry.md
      - Corpus comparison: corpus/compare.md
      - KWIC concordance: corpus/kwic.md
    - Visualization:
      - Zipf's law: visualizers/zipf.md
      - Vocabulary growth: visualizers/vocabulary.md
      - Sentence lengths: visualizers/sentences.md
      - Literature fingerprinting: visualizers/fingerprinting.md
      - Word tree: visualizers/word_tree.md
      - Corpus plots: visualizers/corpus.md
      - Stylometric plots: visualizers/stylometry.md
      - Text highlighting: visualizers/highlight.md
    - Components: components.md
    - Datasets: datasets.md
    - Utilities: utils.md

theme:
  name: material
  language: en
  palette:
    primary: teal
    accent: teal
  font:
    text: Source Sans Pro
  features:
    - navigation.tabs

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SergeyShk
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/kouki91/

extra_css:
  - css/extra.css

extra_javascript:
  - js/config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js

markdown_extensions:
  - toc:
      permalink: True
  - attr_list
  - admonition
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: True
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
